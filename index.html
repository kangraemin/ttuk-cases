<p class="sub">카드를 누르면 실제 게임이 그 장면을 바로 재생한다. 한 번 탭하면 소리와 함께 시작. 지금 코드 그대로라 녹화본과 다를 수 있다.</p>

ct":"사연 카드 '6장 7일차 라이브 합동'. 보스 칩과 '평균 N점 넘기기', 보스의 도발 한 줄, 그리고 이 날 규칙 칩('목표 교체')이 보인다.","tags":["영업 일지","6장","보스","사연"],"patient":null,"duration":15,"status":"ok","p":"videos/campaign-ch6-boss-story.jpg?v=1022h","u":"play/index.html?case=campaign-ch6-boss-story"},{"id":"campaign-ch7-boss-story","modeName":"목꺾기","result":"info","resultName":"안내","title":"영업 일지 7장 보스 사연: 청결 인증 (구역 축소)","repro":"48일을 깬 저장으로 영업 일지를 열고 7장 7일차를 고른다.","expect":"사연 카드 '7장 7일차 청결 인증'. 보스 칩과 '평균 N점 넘기기', 보스의 도발 한 줄, 그리고 이 날 규칙 칩('구역 축소')이 보인다.","tags":["영업 일지","7장","보스","사연"],"patient":null,"duration":15,"status":"ok","p":"videos/campaign-ch7-boss-story.jpg?v=1022h","u":"play/index.html?case=campaign-ch7-boss-story"},{"id":"ending-card","modeName":"목꺾기","result":"end","resultName":"종료·결과","title":"엔딩 카드 (56일차를 처음 깼을 때)","repro":"56일차 뚝할배를 처음 클리어하면 결과 카드의 '엔딩 보기'를 누른다. 사이트에서는 카드를 바로 연다.","expect":"'뚝 카이로 클리닉, 간판은 계속 달려 있어요' 제목 아래 단골들의 뒷이야기 다섯 줄, 이어서 '심야 진료가 열렸어요' 안내와 '영업 일지로' 버튼.","tags":["엔딩","56일차","영업 일지"],"patient":null,"duration":15,"status":"ok","p":"videos/ending-card.jpg?v=1022h","u":"play/index.html?case=ending-card"},{"id":"weekly-result","modeName":"목꺾기","result":"end","resultName":"종료·결과","title":"주간 챌린지 결과 카드 (통증을 다 써서 끝)","repro":"주간 챌린지를 시작해 환자를 계속 틀려(목꺾기는 한계 초과, 목뽑기는 헐렁하게 당김) 통증 칸을 모두 쓴다.","expect":"결과 카드 '주간 챌린지'에 이번 주 규칙, 그 주 최고 기록(보너스 반영)과 자랑하기 버튼. 같은 주에는 누구나 같은 세트라 점수를 견줄 수 있다.","tags":["주간 챌린지","통증","결과 화면"],"patient":null,"duration":30,"status":"ok","p":"videos/weekly-result.jpg?v=1022h","u":"play/index.html?case=weekly-result"},{"id":"daily-result","modeName":"목꺾기","result":"end","resultName":"종료·결과","title":"오늘의 도전 결과 카드 (출근 도장 + 오늘 최고 기록)","repro":"오늘의 도전을 시작해 오늘 환자 한 명을 정확히 꺾는다(목꺾기는 양쪽, 목뽑기는 한 번). 연속 출근 6일째에서 하루가 끊긴 저장으로 시작한다.","expect":"결과 카드 '오늘의 도전'에 오늘 규칙과 도전 횟수, 오늘 최고 기록, 아래 '출근 1일째' 도장 줄(하루 끊겨 다시 1일째)과 주 버튼 '오늘의 도전 다시'.","tags":["오늘의 도전","출근 도장","결과 화면"],"patient":null,"duration":0,"status":"ok","p":"videos/daily-result.jpg?v=1023","u":"play/index.html?case=dail
